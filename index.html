<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Ele vai!</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #fef9e7;
      text-align: center;
      padding: 50px;
    }
    h1 {
      color: #e67e22;
      animation: pulse 2s infinite;
    }
    p {
      font-size: 24px;
      margin: 20px 0;
      color: #2c3e50;
      animation: blink 1.5s infinite;
    }
    button {
      font-size: 20px;
      padding: 15px 30px;
      margin-top: 30px;
      background-color: #27ae60;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: transform 0.2s;
    }
    button:hover {
      transform: scale(1.1);
      background-color: #2ecc71;
    }
    @keyframes blink {
      0% { opacity: 1; }
      50% { opacity: 0; }
      100% { opacity: 1; }
    }
    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.1); }
      100% { transform: scale(1); }
    }
  </style>
</head>
<body>
  <h1>Você vai ir simm</h1>
  <p>Ele vai!</p>
  <p>Vai sim, não tem escapatória!</p>
  <p>Não a como escapar</p>
  <p>Se não for, coisas irão acontecer!!</p>
  <p>Todo mundo já sabe: você vai!</p>
  <p>Não adianta negar, o destino já decidiu!</p>
  <p>Vai ser épico, e você vai estar lá!</p>

  <button onclick="alert('É ISSO MESMO: VOCÊ VAIIIII!!!!')">Clique aqui</button>
</body>
</html>
